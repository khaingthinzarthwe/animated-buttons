<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Buttons</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Zen+Kaku+Gothic+Antique&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="link-code">
        <a href="https://github.com/khaingthinzarthwe/animated-buttons">Code</a>
    </div>
    <div class="container">
        <h1>Animated Buttons</h1>
        <!-- fill color when hover -->
        <h2>Hover Background Effect</h2>
        <div class="btn-gp">
            <button class="btn btn-bg-fill">Hover Me</button>
            <button class="btn btn-fill-v btn-fill-v1">Hover Me</button>
            <button class="btn btn-fill-v btn-fill-v2">Hover Me</button>
        </div>

        <div class="btn-gp">
            <button class="btn btn-fill-h btn-fill-h1">Hover Me</button>
            <button class="btn btn-fill-h btn-fill-h2">Hover Me</button>
        </div>

        <!-- icon slide when hover -->
        <h2>Hover Icon Slide</h2>
        <div class="btn-gp">
            <button class="btn btn-slide btn-slide1">Continue</button>
            <button class="btn btn-slide btn-slide2">Return</button>
            <button class="btn btn-bg-slide">Wake Me Up When September Ends</button>
        </div>

        <!-- box shadow button -->
        <h2>Box Shadow Button</h2>
        <div class="btn-gp mb0">
            <button class="btn btn-shadow">Box Shadow</button>
        </div>
    </div>
</body>
</html>
